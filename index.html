<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArkWay Creative</title>
<style>
:root{
  --bg:#090D16;--panel:#0D1219;--gold:#D4AF37;--gold2:#E2C66B;
  --text:#F7F7F4;--muted:#9AA4AF;--line:#252D39;--line2:#394451;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.locked{overflow:hidden}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}
.site{min-height:100vh;overflow:hidden}
.nav{height:76px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;background:rgba(9,13,22,.96);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;background:none;border:0;color:#fff}
.brand img,.footer-brand img{height:40px;width:auto;max-width:190px;object-fit:contain;display:block}
.brand span{display:grid;gap:3px}.brand strong{font-size:14px;letter-spacing:2.5px}.brand small{font-size:8px;letter-spacing:2px;color:var(--gold)}
.navlinks{display:flex;align-items:center;gap:8px}
.navlink{border:0;background:transparent;color:var(--muted);padding:10px 12px;font-size:11px;letter-spacing:.8px}
.navlink:hover,.navlink.active{color:var(--gold)}
.menu{display:none;background:transparent;color:#fff;border:1px solid var(--line);padding:8px}
.eyebrow,.kicker,.card-label{color:var(--gold);font-size:9px;letter-spacing:2px;font-weight:900}
h1,h2,h3,p{margin-top:0}
h1,h2{line-height:.92;letter-spacing:-4px}
h1{font-size:clamp(48px,7vw,94px);margin:24px 0}
h2{font-size:clamp(40px,5.6vw,76px);margin-bottom:18px}
h3{font-size:27px;line-height:1.05;letter-spacing:-1px}
em{font-family:Georgia,"Times New Roman",serif;color:var(--gold);font-weight:400}
p{color:var(--muted);line-height:1.7}
.primary,.secondary,.hero-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900}
.primary{background:var(--gold);color:#090D16;border:1px solid var(--gold);padding:12px 16px}
.primary:hover{background:var(--gold2);border-color:var(--gold2);transform:translateY(-1px)}
.secondary{background:transparent;color:#fff;border:1px solid var(--line2);padding:12px 16px}
.secondary:hover{border-color:var(--gold);color:var(--gold)}
.large{padding:14px 18px}.small{font-size:10px;padding:10px 12px}
.home-hero{
  min-height:calc(100vh - 76px);padding:80px 8vw 72px;display:flex;align-items:flex-end;
  position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:
    linear-gradient(180deg,rgba(9,13,22,.58) 0%,rgba(9,13,22,.82) 42%,rgba(9,13,22,.98) 100%),
    url("https://lh3.googleusercontent.com/d/1Kl4dplfcrAjRYt88Wi7aSX_wsFlTuz6z") center/cover no-repeat;
}
.home-copy{max-width:1050px;position:relative;z-index:2}
.home-hero .kicker{color:var(--gold)}
.home-hero h1 strong{font-weight:900;color:#fff}.home-hero h1 em{font-style:italic}
.positioning{max-width:780px;font-size:18px}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:30px;width:min(370px,100%)}
.hero-actions .primary,.hero-actions .hero-secondary{flex:1 1 calc(50% - 5px);min-height:44px;white-space:nowrap}
.hero-secondary{background:#0D1219;color:var(--gold);border:1px solid var(--gold);padding:14px 18px}
.hero-secondary:hover{background:#111720;border-color:var(--gold2);color:var(--gold2)}
.hero-tertiary{flex:0 0 100%;text-align:center;color:var(--gold);font-size:13px;font-weight:900;padding:7px;border:0;background:none}
.hero-tertiary:hover{text-decoration:underline;text-underline-offset:4px}
.section{padding:85px 8vw 110px}
.doors-section{padding:100px 8vw;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#080b10,#0a0e13)}
.door-intro{display:grid;grid-template-columns:.8fr 1.1fr .8fr;gap:5vw;align-items:end;margin-bottom:40px}
.door-intro p:last-child{margin:0}
.door-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.door-card{min-height:360px;padding:30px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;position:relative;overflow:hidden}
.door-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.door-card:hover{border-color:var(--gold);background:#10161e;transform:translateY(-3px)}
.door-top{display:flex;justify-content:space-between;color:var(--gold)}
.door-card:nth-child(2):before{background:#557B61}.door-card:nth-child(3):before{background:#805B43}
.door-card h3{font-size:34px;margin-bottom:12px}.door-card p{max-width:330px}
.door-cta{display:flex;align-items:center;gap:7px;color:var(--gold);font-size:11px;font-weight:900}
.manifesto{padding:110px 8vw;display:grid;grid-template-columns:.8fr 1.5fr;gap:6vw}
.portal-head{display:grid;grid-template-columns:1.25fr .75fr;gap:8vw;align-items:end;margin-bottom:50px}
.portal-head>p{margin:0;max-width:550px}
.service-groups{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.service-group{border:1px solid var(--line);background:var(--panel);padding:30px;min-height:350px;display:flex;flex-direction:column}
.service-group:nth-child(2){background:linear-gradient(135deg,#0D1219,rgba(72,107,85,.08))}
.service-group:nth-child(3){background:linear-gradient(135deg,#0D1219,rgba(112,80,58,.08))}
.service-group:nth-child(4){background:linear-gradient(135deg,#0D1219,rgba(201,168,76,.08))}
.service-group-head{display:flex;justify-content:space-between;margin-bottom:50px;color:var(--gold)}
.service-group h3{font-size:30px}.service-group ul{list-style:none;padding:0;margin:10px 0 25px;display:grid;gap:8px}
.service-group li{color:#c5ccd4;font-size:12px;padding-left:15px;position:relative}.service-group li:before{content:"+";position:absolute;left:0;color:var(--gold)}
.outline-action{margin-top:auto;width:max-content;border:1px solid var(--line2);background:none;color:var(--gold);padding:10px 13px;font-size:11px;font-weight:900}
.services-contact-strip{margin-top:15px;border:1px solid var(--line);padding:25px 30px;display:flex;justify-content:space-between;align-items:center;gap:30px;background:linear-gradient(100deg,rgba(201,168,76,.08),rgba(72,107,85,.05))}
.services-contact-strip strong{display:block;margin:7px 0}.services-contact-strip p{margin:0;font-size:12px}.services-contact-actions{display:flex;gap:9px;flex-wrap:wrap}
.product-filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding:5px;border:1px solid #303947;background:#0D1219;width:max-content;max-width:100%}
.product-filter-bar button{border:1px solid transparent;background:transparent;color:#8F99A5;padding:10px 12px;font-size:9px;font-weight:900;letter-spacing:1px}
.product-filter-bar button.active,.product-filter-bar button:hover{background:var(--gold);color:#090D16;border-color:var(--gold)}
.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.product-card{padding:22px;border:1px solid #303947;background:#090D16;display:flex;flex-direction:column;transition:.2s}
.product-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.product-card-top{display:flex;justify-content:space-between;gap:12px}.product-badges{display:flex;gap:6px;flex-wrap:wrap}
.product-category-badge,.product-coming-pill,.product-price{padding:7px 9px;font-size:8px;font-weight:900;letter-spacing:1.2px}
.product-category-badge{border:1px solid var(--line2);color:var(--gold)}.product-coming-pill{background:var(--gold);color:#090D16}.product-price{border:1px solid rgba(212,175,55,.55);color:var(--gold)}
.product-card-copy{padding:30px 0 22px}.product-card-copy h3{font-size:24px}.product-spec{font-size:11px;min-height:38px}
.product-preview{border:1px solid var(--line);background:#0D1219;padding:15px}.product-preview-head{display:flex;justify-content:space-between;color:#65717E;font-size:7px;letter-spacing:1.5px;font-weight:900}
.waveform{height:58px;margin:14px 0;display:flex;align-items:center;justify-content:space-between;gap:3px;overflow:hidden}
.waveform span{width:2px;background:var(--gold);display:block}.waveform.playing span{animation:pulse .65s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scaleY(.55)}to{transform:scaleY(1.2)}}
.product-preview-button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:#090D16;color:var(--gold);padding:10px;font-size:10px;font-weight:900}
.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:18px}
.product-notify,.product-share{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:none;color:var(--gold);padding:10px;font-size:9px;font-weight:900;text-align:center}
.product-empty{grid-column:1/-1;border:1px solid var(--line);padding:40px}
.community-landing{background:#090D16}.community-editorial-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.community-editorial-card{min-height:285px;border:1px solid #303947;background:#090D16;position:relative;overflow:hidden;transition:.2s}
.community-editorial-card:hover{border-color:var(--gold);background:#0D1219;transform:translateY(-2px)}
.community-editorial-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);opacity:.5}
.community-editorial-hit{width:100%;height:100%;min-height:inherit;padding:25px 27px;border:0;background:none;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.community-editorial-hit:disabled{opacity:1;cursor:default}
.community-editorial-top{display:flex;justify-content:space-between;color:var(--gold)}.community-door-number{font-size:10px;font-weight:900;letter-spacing:2px;color:#8E7A45}
.community-editorial-copy{margin:34px 0 25px}.community-kicker{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:2px}
.community-editorial-copy h2{font-family:inherit;font-size:clamp(28px,3.2vw,44px);letter-spacing:-1.7px;color:#fff;margin:10px 0 12px}
.community-editorial-copy p{font-size:12px}.community-editorial-bottom span{color:var(--gold);font-size:10px;font-weight:900}.status-badge{display:inline-flex;padding:8px 10px;border:1px solid #58616C;color:#A9B1BA!important;font-size:8px!important;letter-spacing:1.7px}
.subview{min-height:calc(100vh - 76px);padding:70px 8vw 110px}.back{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:none;color:var(--gold);padding:9px 12px;font-size:10px;font-weight:900;margin-bottom:45px}
.discography-toggle{display:inline-flex;margin:0 0 24px;border:1px solid #303947;background:#0D1219;padding:3px;border-radius:999px}
.discography-toggle button{border:0;background:none;color:#8F99A5;padding:10px 15px;border-radius:999px;font-size:10px;font-weight:900}
.discography-toggle button.active{background:var(--gold);color:#090D16}
.discography-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.release-card{border:1px solid #303947;background:#0D1219;padding:0;overflow:hidden}.release-card iframe{display:block;width:100%;height:152px;border:0}
.hustlesasa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.hustlesasa-card{border:1px solid #303947;background:#090D16;padding:20px}.hustlesasa-topline{display:flex;justify-content:space-between;gap:12px}.hustlesasa-topline h3{font-size:20px}.price-badge{border:1px solid rgba(212,175,55,.55);color:var(--gold);padding:6px 8px;font-size:9px;white-space:nowrap}.download-category{display:inline-block;border:1px solid #303947;padding:6px 8px;color:#9C8550;font-size:8px;letter-spacing:1.3px;margin:8px 0 18px}.hustle-cta{width:100%}
.community-reel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.universe-media-card{border:1px solid #303947;background:#0D1219;overflow:hidden}.universe-video{aspect-ratio:16/9;background:#05070B}.universe-video iframe{width:100%;height:100%;border:0}.universe-media-copy{padding:20px}.universe-media-copy h3{font-size:21px;margin:9px 0}.universe-media-copy p{font-size:12px}
footer{border-top:1px solid var(--line);padding:40px 6vw 25px;background:#070a0e}.footer-top{display:flex;justify-content:space-between;gap:30px;align-items:center;padding-bottom:35px;border-bottom:1px solid var(--line)}
.footer-brand{display:flex;align-items:center;gap:11px}.footer-brand div{display:grid;gap:4px}.footer-brand strong{font-size:14px;letter-spacing:2px}.footer-brand span{font-size:8px;letter-spacing:2px;color:var(--gold)}
.footer-contact{display:flex;flex-direction:column;align-items:flex-end;gap:8px;color:#a9b2bc;font-size:11px}.footer-contact a:hover{color:var(--gold)}
.footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:30px 0}.footer-grid>div{display:flex;flex-direction:column;gap:8px}.footer-grid button{border:0;padding:0;background:none;color:#8b96a2;text-align:left;font-size:11px}.footer-grid button:hover{color:var(--gold)}.footer-bottom{display:flex;justify-content:space-between;color:#4f5964;font-size:8px;letter-spacing:1px;padding-top:20px}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.modal{width:min(520px,100%);border:1px solid var(--line2);background:#0b1016;padding:35px;position:relative}.modal-close{position:absolute;right:15px;top:15px;border:1px solid var(--line);background:none;color:#fff;padding:8px}.modal h2{font-size:48px;margin-bottom:18px}.modal-actions{display:grid;gap:10px;margin-top:25px}.modal-note{display:block;color:#69737f;font-size:9px;text-align:center;margin-top:15px}
@media(max-width:1050px){.product-grid{grid-template-columns:repeat(2,1fr)}.hustlesasa-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
 .menu{display:block}.navlinks{display:none;position:absolute;top:76px;left:0;right:0;padding:18px 5vw 25px;background:#080b10;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch}.navlinks.open{display:flex}.navlink{text-align:left}
 .home-hero{min-height:calc(100svh - 76px);padding:50px 6vw 58px}.portal-head,.door-intro,.manifesto{grid-template-columns:1fr}.door-grid,.service-groups,.product-grid,.community-editorial-grid,.discography-grid,.community-reel-grid,.hustlesasa-grid{grid-template-columns:1fr}
 .door-intro{gap:20px}.services-contact-strip{flex-direction:column;align-items:flex-start}.footer-top,.footer-bottom{flex-direction:column;align-items:flex-start}.footer-contact{align-items:flex-start}.footer-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
 .brand img,.footer-brand img{height:36px;max-width:155px}.hero-actions{max-width:360px}.hero-actions .primary,.hero-actions .hero-secondary{font-size:13px;padding:12px 10px}
 h1{font-size:clamp(44px,12vw,68px);letter-spacing:-3px}h2{font-size:clamp(38px,10vw,55px);letter-spacing:-2px}
 .section,.subview,.doors-section,.manifesto{padding-left:6vw;padding-right:6vw}.home-hero{padding-left:6vw;padding-right:6vw}.modal{padding:25px 20px}.modal h2{font-size:40px}.product-actions{grid-template-columns:1fr}
 .discography-toggle{display:flex;width:100%}.discography-toggle button{flex:1;padding:10px 8px}
}
</style>

 ["products","02 / PRODUCTS","Products","Loop kits, beat packs, drum vaults, foley and sound libraries.","headphones"],
 ["community","03 / COMMUNITY","Community","Music releases, film writing, live show tickets, and official goods.","ticket"]
 ].map(d=>`<button class="door-card" data-href="#${d[0]}"><div class="door-top"><span>${d[1]}</span><span>${icon(d[4])}</span></div><div><h3>${d[2]}</h3><p>${d[3]}</p></div><span class="door-cta">Explore ${icon("arrow")}</span></button>`).join("")}
 </div></section>
 <section class="manifesto"><span class="card-label">THE ARKWAY PRINCIPLE</span><h2>Make it. Release it. <em>Build the culture around it.</em></h2></section>`;
}

function services(){
 const groups=[
 ["01 / AUDIO PRODUCTION","Record, produce & finish.","The core studio work: from the first vocal take to a finished, release-ready record.",["Recording & Vocal Production","Music Production","Mixing & Mastering","Beat Production","Live Instrument Recording"]],
 ["02 / FILM & MEDIA SOUND","Score the picture.","Sound built around the story — not pasted onto it.",["Audio Jingles & Sonic Branding","Voiceover & Dialogue Production","Film, Series & Game Scoring"]],
 ["03 / BRAND ARCHITECTURE","Build the media system.","Creative direction, campaign thinking and brand architecture for people and organizations that need their message to move.",["Brand Identity & Creative Direction","Campaign & Content Architecture","Digital Media Strategy"]],
 ["04 / DATA & ANALYTICS","Make creative decisions with evidence.","Data analytics is the intelligence layer behind media, audience and business decisions.",["Market Research & Business Analytics","Audience & Performance Analysis","Dashboards & Reporting"]]
 ];
 return `<section class="section"><div class="portal-head"><div><p class="eyebrow">01 · SERVICES</p><h1>Creative work, backed by <em>intelligence.</em></h1></div><p>Tell us what you are building. We group the work by outcome instead of forcing you through a price list. Reach out directly and ArkWay will scope the right service, timeline and quote with you.</p></div>
 <div class="service-groups">${groups.map(g=>`<article class="service-group"><div class="service-group-head"><span class="card-label">${g[0]}</span><span>→</span></div><h3>${g[1]}</h3><p>${g[2]}</p><ul>${g[3].map(x=>`<li>${x}</li>`).join("")}</ul><button class="outline-action book-service" data-service="${g[1]}">Reach out to book →</button></article>`).join("")}</div>
 <div class="services-contact-strip"><div><span class="card-label">DIRECT BOOKING</span><strong>Start with WhatsApp or email.</strong><p>Tell us what you need, your deadline and what you already have. We will take it from there.</p></div><div class="services-contact-actions"><a class="primary large" target="_blank" rel="noopener" href="${inquiry("a project with ArkWay","whatsapp")}">WhatsApp ${icon("arrow")}</a><a class="secondary large" href="${inquiry("a project with ArkWay","email")}">Email ${icon("mail")}</a></div></div></section>`;
}

function products(){
 const filters=["ALL PRODUCTS","BEATS","FILM SCORES","LOOPS","DRUM KITS","FX","FOLEY"];
 const hashQuery=location.hash.includes("?")?location.hash.split("?")[1]:"";
 const active=new URLSearchParams(hashQuery).get("filter")||"ALL PRODUCTS";
 const visible=active==="ALL PRODUCTS"?catalog:catalog.filter(x=>x.category===active);
 return `<section class="section"><div class="portal-head"><div><p class="eyebrow">02 · PRODUCTS</p><h1>Open the <em>sound vault.</em></h1></div><p>Digital tools for producers, filmmakers and artists — curated drops of beats, loops, drums, FX and foley, engineered for independent work.</p></div>
 <div class="product-filter-bar">${filters.map(f=>`<button class="${active===f?"active":""}" data-filter="${f}">${f}</button>`).join("")}</div>
 <div class="product-grid">${visible.length?visible.map(p=>`<article class="product-card" id="product-${p.id}"><div class="product-card-top"><div class="product-badges"><span class="product-category-badge">${p.category}</span><span class="product-coming-pill">COMING SOON</span></div><span class="product-price">${p.price}</span></div><div class="product-card-copy"><h3>${p.title}</h3><p class="product-spec">${p.specs}</p></div><div class="product-preview"><div class="product-preview-head"><span>DEMO PREVIEW</span><span>PLACEHOLDER STREAM</span></div><div class="waveform">${Array.from({length:42},(_,i)=>`<span style="height:${20+((i*19)%58)}%"></span>`).join("")}</div><button class="product-preview-button" data-play="${p.id}">${icon("play")} Play Demo</button></div><div class="product-actions"><a class="product-notify" href="https://arkway.hustlesasa.shop" target="_blank" rel="noopener">Notify Me / Coming Soon →</a><button class="product-share" data-share="${p.id}">Share Link →</button></div></article>`).join(""):`<div class="product-empty"><span class="eyebrow">NO MOCK DROPS YET</span><h3>${active} are queued for a future ArkWay release.</h3><p>Switch to All Products to see the current Coming Soon templates.</p></div>`}</div></section>`;
}

function community(){
 const cards=[
 {num:"01",kicker:"SOLO CATALOG",title:"Official Discography",desc:"Stream Yovan's solo EPs and singles directly.",target:"discography",cta:"Explore catalog →"},
 {num:"02",kicker:"VISUAL REELS",title:"Showreels & Short Film",desc:'Music Video Showcase & "SURVIVAL" Short Film.',target:"reels",cta:"Watch reels →"},
 {num:"03",kicker:"ARTIST CREDITS",title:"Produced Work & Collaborations",desc:"Tracks and releases engineered for collaborating artists under ArkWay.",target:"credits",cta:"View credits →"},
 {num:"04",kicker:"ON STAGE",title:"Live Sets & Performances",desc:"Recorded live arrangements, acoustic sessions, and stage sets.",target:"live",cta:"Watch live sessions →"},
 {num:"05",kicker:"FILM & CULTURE",title:"Between Frames",desc:"Film critiques, narrative analysis, and cultural essays by Yovan.",external:"https://yovan.substack.com",cta:"Read Between Frames →"},
 {num:"06",kicker:"STORE",title:"ArkWay Apparel & Merch",desc:"Signature streetwear, bandanas, and physical drops engineered by ArkWay Creative.",target:"coming"},
 {num:"07",kicker:"EVENTS",title:"Live Shows & Tickets",desc:"Upcoming ArkWay live showcases, concert dates, and ticket releases.",target:"coming"}
 ];
 return `<section class="section community-landing"><div class="portal-head"><div><p class="eyebrow">03 · COMMUNITY</p><h1>WELCOME TO THE ARKWAY COMMUNITY</h1></div><p>Explore the media catalog engineered under ArkWay Creative—featuring Yovan's solo projects, production credits, featured artist collaborations, live sessions, film critiques, apparel, and live events.</p></div>
 <div class="community-editorial-grid">${cards.map(c=>{
   if(c.external){
     return `<article class="community-editorial-card"><a class="community-editorial-hit" href="${c.external}" target="_blank" rel="noopener"><div class="community-editorial-top"><span class="community-door-number">${c.num}</span><span>${icon("arrow")}</span></div><div class="community-editorial-copy"><span class="community-kicker">${c.kicker}</span><h2>${c.title}</h2><p>${c.desc}</p></div><div class="community-editorial-bottom"><span>${c.cta}</span></div></a></article>`;
   }
   const isComing = c.target === "coming";
   return `<article class="community-editorial-card"><button class="community-editorial-hit" ${isComing ? "disabled" : `data-community="${c.target}"`}><div class="community-editorial-top"><span class="community-door-number">${c.num}</span><span>${icon("arrow")}</span></div><div class="community-editorial-copy"><span class="community-kicker">${c.kicker}</span><h2>${c.title}</h2><p>${c.desc}</p></div><div class="community-editorial-bottom">${isComing ? '<span class="status-badge">COMING SOON</span>' : `<span>${c.cta}</span>`}</div></button></article>`;
 }).join("")}</div></section>`;
}

function discography(){
 return `<section class="subview"><a class="back" href="#community">← Back to Community</a><div class="portal-head"><div><p class="eyebrow">SOLO CATALOG</p><h1>Official <em>Discography.</em></h1></div><p>Stream Yovan's solo EPs or purchase full-fidelity lossless downloads for offline listening.</p></div>
 <div class="discography-toggle"><button class="active" data-mode="stream">Stream</button><button data-mode="download">Download for Offline</button></div>
 <div id="discographyContent" class="discography-grid">${releases.map(r=>`<article class="release-card"><iframe src="${r[1]}" title="${r[0]} on Spotify" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></article>`).join("")}</div></section>`;
}

function downloads(){
 return `<div class="hustlesasa-grid">${hustlesasa.map(p=>`<article class="hustlesasa-card"><div class="hustlesasa-topline"><h3>${p[0]}</h3><span class="price-badge">${p[2]}</span></div><span class="download-category">${p[1]}</span><a class="primary small hustle-cta" href="${p[3]}" target="_blank" rel="noopener">Buy &amp; Download on Hustlesasa ${icon("bag")}</a></article>`).join("")}</div>`;
}

function reels(){
 return `<section class="subview"><a class="back" href="#community">← Back to Community</a><div class="portal-head"><div><p class="eyebrow">VISUAL REELS</p><h1>Showreels & <em>Short Film.</em></h1></div><p>Music Video Showcase & "SURVIVAL" Short Film.</p></div>
 <div class="community-reel-grid"><article class="universe-media-card"><div class="universe-video"><iframe src="https://www.youtube.com/embed/" title="ArkWay Music & Production Reel" loading="lazy"></iframe></div><div class="universe-media-copy"><span class="card-label">MUSIC PRODUCTION REEL</span><h3>ArkWay Music & Production Reel</h3><p>Showcase of music production, scoring, and original compositions engineered under ArkWay Creative.</p></div></article><article class="universe-media-card"><div class="universe-video"><iframe src="https://www.youtube.com/embed/" title="SURVIVAL Short Film" loading="lazy"></iframe></div><div class="universe-media-copy"><span class="card-label">SURVIVAL · SHORT FILM</span><h3>SURVIVAL | Short Film</h3><p>Cinematic narrative short film produced and scored under ArkWay Creative.</p></div></article></div></section>`;
}

function render(){
 const r=route();
 let content="";
 if(r.root==="home") content=home();
 else if(r.root==="services") content=services();
 else if(r.root==="products") content=products();
 else if(r.root==="community"){
   if(r.sub==="discography") content=discography();
   else if(r.sub==="reels") content=reels();
   else content=community();
 } else {
   content=home();
 }
 
 document.getElementById("app").innerHTML=content;
 document.querySelectorAll(".navlink").forEach(b=>b.classList.toggle("active",b.dataset.route===r.root));
 document.title="ArkWay Creative — "+(r.root[0].toUpperCase()+r.root.slice(1));
 bind();
 window.scrollTo({top:0,behavior:"smooth"});
}

function bind(){
 document.querySelectorAll("[data-route]").forEach(el=>el.addEventListener("click",()=>{setRoute(el.dataset.route);document.getElementById("navlinks").classList.remove("open")}));
 document.querySelectorAll("[data-href]").forEach(el=>el.addEventListener("click",()=>location.hash=el.dataset.href));
 document.querySelectorAll(".book-service").forEach(el=>el.addEventListener("click",()=>showModal(el.dataset.service)));
 document.querySelectorAll("[data-filter]").forEach(el=>el.addEventListener("click",()=>{location.hash="#products?filter="+encodeURIComponent(el.dataset.filter)}));
 document.querySelectorAll("[data-play]").forEach(el=>el.addEventListener("click",()=>{
   const preview = el.closest(".product-preview");
   const wave = preview.querySelector(".waveform");
   wave.classList.toggle("playing");
   el.innerHTML = wave.classList.contains("playing") ? "Ⅱ Pause Demo" : "▶ Play Demo";
 }));
 document.querySelectorAll("[data-share]").forEach(el=>el.addEventListener("click",async()=>{
   const u=location.origin+location.pathname+"#products?id="+el.dataset.share;
   try{await navigator.clipboard.writeText(u);el.textContent="Link Copied"}catch{window.prompt("Copy this ArkWay product link:",u)}
   setTimeout(()=>el.textContent="Share Link →",1800)
 }));
 document.querySelectorAll("[data-community]").forEach(el=>el.addEventListener("click",()=>setRoute("community",el.dataset.community)));
 document.querySelectorAll("[data-mode]").forEach(el=>el.addEventListener("click",()=>{
   document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));
   el.classList.add("active");
   document.getElementById("discographyContent").innerHTML=el.dataset.mode==="download"?downloads():releases.map(r=>`<article class="release-card"><iframe src="${r[1]}" title="${r[0]} on Spotify" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></article>`).join("");
 }));
}

function showModal(service){
 document.body.classList.add("locked");
 const wrap=document.createElement("div");wrap.className="modal-backdrop";
 wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><button class="modal-close" aria-label="Close">×</button><p class="eyebrow">INSTANT INQUIRY</p><h2>Book <em>${service}</em></h2><p>Choose how you want to start the conversation. Your service details will be pre-filled.</p><div class="modal-actions"><a class="primary large" target="_blank" rel="noopener" href="${inquiry(service,"whatsapp")}">Open WhatsApp →</a><a class="secondary large" href="${inquiry(service,"email")}">Send Email ✉</a></div><span class="modal-note">${BUSINESS.phone} · ${BUSINESS.email}</span></div>`;
 document.body.appendChild(wrap);
 const close=()=>{wrap.remove();document.body.classList.remove("locked")};
 wrap.addEventListener("mousedown",e=>{if(e.target===wrap)close()});wrap.querySelector(".modal-close").addEventListener("click",close);
}

document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("navlinks").classList.toggle("open"));
window.addEventListener("hashchange",render);
if(!location.hash) history.replaceState({}, "", "#home");
render();
</script>
</body>
</html>
