<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#090D16">
<title>ArkWay Creative</title>
<style>
:root{--bg:#090D16;--panel:#0D1219;--panel2:#111720;--gold:#D4AF37;--gold2:#C9A84C;--muted:#9AA3AE;--line:#303947;--white:#F4F1E8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Arial,Helvetica,sans-serif;line-height:1.5}
body.locked{overflow:hidden}
a{text-decoration:none;color:inherit}
button{font:inherit}
.site-nav{position:sticky;top:0;z-index:100;background:rgba(9,13,22,.94);backdrop-filter:blur(14px);border-bottom:1px solid #252D38;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}
.brand,.footer-brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:1.5px}
.brand img,.footer-brand img{width:38px;height:38px;object-fit:contain}
.navlinks{display:flex;gap:8px}
.navlink{border:0;background:transparent;color:#AAB1BA;padding:10px 13px;font-size:11px;font-weight:900;letter-spacing:1.5px;cursor:pointer}
.navlink:hover,.navlink.active{color:var(--gold)}
.menu-toggle{display:none;background:none;border:1px solid var(--line);color:#fff;padding:8px 11px}
.section,.subview{padding:80px 6vw;min-height:calc(100svh - 76px)}
.home-hero{min-height:calc(100svh - 76px);padding:50px 6vw 58px;display:flex;align-items:center;background:linear-gradient(180deg,rgba(9,13,22,.58) 0%,rgba(9,13,22,.82) 42%,rgba(9,13,22,.98) 100%),url("https://lh3.googleusercontent.com/d/1Kl4dplfcrAjRYt88Wi7aSX_wsFlTuz6z") center/cover no-repeat}
.hero-inner{max-width:850px}
.eyebrow,.card-label{font-size:10px;letter-spacing:2.2px;font-weight:900;color:var(--gold)}
.home-hero h1{font-size:clamp(48px,8vw,108px);line-height:.91;letter-spacing:-5px;margin:18px 0}
.home-hero h1 em,.portal-head h1 em{color:var(--gold);font-style:normal}
.hero-copy{max-width:650px;color:#C5CAD0;font-size:16px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.primary,.secondary,.hero-secondary,.hero-tertiary,.outline-action{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);padding:13px 17px;font-size:10px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;cursor:pointer}
.primary{background:var(--gold);color:#090D16}
.primary:hover{background:#E1C45D}
.secondary,.hero-secondary{background:transparent;color:var(--gold)}
.secondary:hover,.hero-secondary:hover{background:rgba(212,175,55,.08)}
.hero-tertiary{border:0;padding-left:0;color:#C8CDD4}
.hero-tertiary:hover{color:var(--gold)}
.large{padding:15px 20px}
.small{padding:10px 13px}
.portal-head{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:end;margin-bottom:40px}
.portal-head h1{font-size:clamp(40px,6vw,76px);line-height:.95;letter-spacing:-3px;margin:12px 0}
.portal-head>p{color:#AEB5BD;max-width:570px;font-size:14px}
.door-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.door-card{min-height:250px;text-align:left;padding:25px;background:var(--panel);border:1px solid var(--line);color:#fff;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.door-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.door-top{display:flex;justify-content:space-between;color:var(--gold)}
.door-card h3{font-size:28px;margin:25px 0 8px}
.door-card p{font-size:12px;color:#9DA6B0}
.door-cta{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}
.service-groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.service-group{padding:28px;background:var(--panel);border:1px solid var(--line)}
.service-group h3{font-size:24px;margin:10px 0}
.service-group p{color:#AEB5BD;font-size:12px}
.service-group ul{padding:0;margin:20px 0;list-style:none}
.service-group li{border-top:1px solid #252D38;padding:10px 0;font-size:11px;color:#D0D5DB}
.service-group li:before{content:"→";color:var(--gold);margin-right:8px}
.service-group-head{display:flex;justify-content:space-between;color:var(--gold)}
.services-contact-strip{margin-top:15px;border:1px solid var(--gold2);padding:25px;display:flex;justify-content:space-between;gap:25px;align-items:center}
.services-contact-strip strong{display:block;margin:6px 0}
.services-contact-strip p{margin:0;color:#9DA6B0;font-size:12px}
.services-contact-actions{display:flex;gap:10px;flex-wrap:wrap}
.product-filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.product-filter-bar button{background:transparent;color:#9EA7B1;border:1px solid var(--line);padding:10px 13px;font-size:9px;font-weight:900;letter-spacing:1px;cursor:pointer}
.product-filter-bar button:hover,.product-filter-bar button.active{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.05)}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.product-card{background:var(--panel);border:1px solid var(--line);padding:20px}
.product-card-top,.product-badges,.product-actions,.product-preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.product-badges{justify-content:flex-start}
.product-category-badge,.product-coming-pill,.status-badge{font-size:8px;letter-spacing:1.5px;font-weight:900;padding:7px 9px;border:1px solid var(--line)}
.product-category-badge{color:var(--gold);border-color:#66572D}
.product-coming-pill{color:#8F98A2}
.product-price{color:var(--gold);font-weight:900;font-size:13px}
.product-card-copy{min-height:125px}
.product-card-copy h3{font-size:22px;margin:20px 0 7px}
.product-spec{font-size:11px;color:#9EA7B1}
.product-preview{border:1px solid #252D38;background:#080B10;padding:13px;margin:10px 0 15px}
.product-preview-head{font-size:8px;letter-spacing:1.5px;color:#707985}
.waveform{height:65px;display:flex;align-items:center;gap:3px;margin:12px 0}
.waveform span{display:block;width:4px;background:var(--gold);opacity:.55}
.waveform.playing span{opacity:1}
.product-preview-button{width:100%;background:transparent;border:1px solid #3A4350;color:#D7DCE2;padding:9px;font-size:9px;font-weight:900;cursor:pointer}
.product-preview-button:hover{border-color:var(--gold);color:var(--gold)}
.product-actions{justify-content:flex-start;flex-wrap:wrap}
.product-notify{font-size:9px;color:var(--gold);font-weight:900;letter-spacing:.8px}
.product-share{background:none;border:0;color:#9EA7B1;font-size:9px;cursor:pointer;padding:0}
.product-empty{grid-column:1/-1;border:1px dashed #414A56;padding:60px 25px;text-align:center}
.product-empty h3{font-size:25px;margin:10px 0}
.product-empty p{color:#929BA6;font-size:12px}
.community-landing{background:#090D16}
.community-editorial-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.community-editorial-card{min-height:285px;border:1px solid #303947;background:#090D16;position:relative;overflow:hidden;transition:.2s}
.community-editorial-card:hover{border-color:var(--gold);background:#0D1219;transform:translateY(-2px)}
.community-editorial-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);opacity:.5}
.community-editorial-hit{width:100%;height:100%;min-height:inherit;padding:25px 27px;border:0;background:none;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.community-editorial-hit:disabled{opacity:1;cursor:default}
.community-editorial-top{display:flex;justify-content:space-between;color:var(--gold)}
.community-door-number{font-size:10px;font-weight:900;letter-spacing:2px;color:#8E7A45}
.community-editorial-copy{margin:34px 0 25px}
.community-kicker{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:2px}
.community-editorial-copy h2{font-family:inherit;font-size:clamp(28px,3.2vw,44px);letter-spacing:-1.7px;color:#fff;margin:10px 0 12px}
.community-editorial-copy p{font-size:12px}
.community-editorial-bottom span{color:var(--gold);font-size:10px;font-weight:900}
.status-badge{display:inline-flex;padding:8px 10px;border:1px solid #58616C;color:#A9B1BA!important;font-size:8px!important;letter-spacing:1.7px}
.subview{background:#090D16}
.back{display:inline-block;color:#9EA7B1;font-size:10px;font-weight:900;letter-spacing:1.2px;margin-bottom:30px}
.back:hover{color:var(--gold)}
.discography-toggle{display:flex;gap:8px;margin-bottom:20px}
.discography-toggle button{background:transparent;border:1px solid var(--line);color:#AAB2BC;padding:10px 14px;font-size:9px;font-weight:900;letter-spacing:1px;cursor:pointer}
.discography-toggle button.active{color:var(--gold);border-color:var(--gold)}
.discography-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.release-card{background:#0D1219;border:1px solid var(--line);min-height:352px;overflow:hidden}
.release-card iframe{width:100%;height:100%;min-height:352px;border:0}
.hustlesasa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.hustlesasa-card{border:1px solid var(--line);padding:22px;background:var(--panel)}
.hustlesasa-topline{display:flex;justify-content:space-between;gap:20px}
.hustlesasa-topline h3{margin:0;font-size:22px}
.price-badge{color:var(--gold);font-weight:900}
.download-category{display:block;color:#8F98A2;font-size:9px;letter-spacing:1.5px;margin:10px 0 22px}
.community-reel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.universe-media-card{border:1px solid #303947;background:#0D1219;overflow:hidden}
.universe-video{aspect-ratio:16/9;background:#05070B;display:block;text-decoration:none}
.universe-video iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
.universe-media-copy{padding:20px}
.universe-media-copy h3{font-size:21px;margin:9px 0}
.universe-media-copy p{font-size:12px;color:#A5ADB7}
.outline-action{margin-top:10px;color:var(--gold);padding:10px 12px}
footer{border-top:1px solid #252D38;padding:40px 6vw;background:#070A10;display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
.footer-copy{color:#7F8995;font-size:11px}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
.footer-links a{font-size:10px;color:#AAB2BC}
.footer-links a:hover{color:var(--gold)}
.modal-backdrop{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:20px}
.modal{width:min(560px,100%);background:#0D1219;border:1px solid var(--gold);padding:30px;position:relative}
.modal-close{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
.modal h2{font-size:38px;line-height:1;margin:12px 0}
.modal h2 em{color:var(--gold);font-style:normal}
.modal p{color:#A8B0B9;font-size:12px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.modal-note{display:block;color:#7F8995;font-size:9px;margin-top:18px;letter-spacing:1px}
@media(max-width:900px){
 .portal-head{grid-template-columns:1fr}
 .door-grid,.service-groups,.product-grid,.community-editorial-grid,.discography-grid,.community-reel-grid,.hustlesasa-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
 .site-nav{height:68px;padding:0 5vw}
 .menu-toggle{display:block}
 .navlinks{display:none;position:absolute;top:68px;left:0;right:0;background:#090D16;border-bottom:1px solid var(--line);padding:12px 5vw;flex-direction:column}
 .navlinks.open{display:flex}
 .section,.subview{padding:55px 5vw}
 .home-hero{padding:45px 5vw}
 .home-hero h1{letter-spacing:-3px}
 .services-contact-strip{display:block}
 .services-contact-actions{margin-top:18px}
 footer{padding:35px 5vw}
}
</style>
</head>
<body>

<nav class="site-nav">
  <a class="brand" href="#home" aria-label="ArkWay Creative home">
    <img src="https://lh3.googleusercontent.com/d/1jrEFMFWEB7wO19K-_SJBsEcz4azfM9e4" alt="ArkWay Creative logo">
    <span>ARKWAY CREATIVE</span>
  </a>

  <button class="menu-toggle" id="menuBtn" aria-label="Open navigation">☰</button>

  <div class="navlinks" id="navlinks">
    <button class="navlink" data-route="home">Home</button>
    <button class="navlink" data-route="services">Services</button>
    <button class="navlink" data-route="products">Products</button>
    <button class="navlink" data-route="community">Community</button>
  </div>
</nav>

<main id="app"></main>

<footer>
  <a class="footer-brand" href="#home">
    <img src="https://lh3.googleusercontent.com/d/1jrEFMFWEB7wO19K-_SJBsEcz4azfM9e4" alt="ArkWay Creative logo">
    <span>ARKWAY CREATIVE</span>
  </a>

  <div class="footer-copy">Desire • Dedication • Discipline</div>

  <div class="footer-links">
    <a href="mailto:arkwaycreative@gmail.com">arkwaycreative@gmail.com</a>
    <a href="https://wa.me/254118618199" target="_blank" rel="noopener noreferrer">WhatsApp / Call 0118618199</a>
  </div>
</footer>

<script>
const BUSINESS={
 email:"arkwaycreative@gmail.com",
 phone:"0118618199"
};

const servicesData=[
 ["MUSIC & AUDIO","Music & Audio","Production and finishing for artists who need a complete, dependable sound.",["Track Production","Recording","Mixing & Mastering","Song Packaging"]],
 ["FILM & MEDIA","Film & Media","Original scoring, sound work and creative media support for visual projects.",["Film Scoring","Sound Design","Media Production","Creative Direction"]],
 ["CORPORATE & STRATEGY","Corporate & Strategy","Research, business analytics and creative communication for growing organisations.",["Market Research","Business Analytics","Grant & Proposal Support","Project Support"]],
 ["EVENTS & EXPERIENCES","Events & Experiences","Creative production and event support built around memorable live experiences.",["Event Production","Live Sound Coordination","Show Development","Creative Programming"]]
];

const catalog=[
 {
  id:"mtilu-afro-trap",
  title:"Mtilu Afro-Trap Beat Pack Vol. 1",
  category:"BEATS",
  price:"KES 1,000",
  specs:"Afro-trap production pack engineered for independent artists."
 },
 {
  id:"arkway-drums",
  title:"ArkWay Essential Drum & Percussion Kit",
  category:"DRUM KITS",
  price:"KES 500",
  specs:"Punchy drums and percussion for hip-hop, trap and hybrid production."
 },
 {
  id:"cinematic-foley",
  title:"Cinematic Textures & African Foley Suite",
  category:"FOLEY",
  price:"KES 750",
  specs:"Organic textures and cinematic Foley designed for film and visual storytelling."
 }
];

const releases=[
 ["Noah's Blueprint","https://open.spotify.com/embed/album/5EjyP8dCSNK6DlwH9YNqOG?utm_source=generator"],
 ["Sticks and Stones","https://open.spotify.com/embed/album/0VqF4rV6r0bM0kW2Y9wQ3J?utm_source=generator"]
];

const hustlesasa=[
 ["FootOnTheGas EP","MUSIC","KES 200","https://hustlesasa.shop/product/67705"],
 ["ArkWay Digital Drop","DIGITAL","COMING SOON","https://arkway.hustlesasa.shop"]
];

window.productFilter="ALL PRODUCTS";

function icon(type){
 const icons={
  arrow:"→",
  ticket:"✦",
  mail:"✉",
  bag:"▣"
 };
 return icons[type]||"→";
}

function inquiry(service,method){
 const message=`Hello ArkWay Creative. I would like to inquire about ${service}.`;

 if(method==="whatsapp"){
  return `https://wa.me/254118618199?text=${encodeURIComponent(message)}`;
 }

 return `mailto:${BUSINESS.email}?subject=${encodeURIComponent("ArkWay Creative — "+service)}&body=${encodeURIComponent(message)}`;
}

function route(){
 const raw=location.hash.replace(/^#/,"")||"home";
 const parts=raw.split("/");

 return {
  root:["services","products","community"].includes(parts[0])?parts[0]:"home",
  sub:parts[1]||""
 };
}

function setRoute(routeName,sub){
 location.hash="#"+routeName+(sub?"/"+sub:"");
}

function home(){
 const doors=[
  ["services","01 / SERVICES","Services","Music, film, strategy, events and creative support.","arrow"],
  ["products","02 / PRODUCTS","Products","Digital sound tools, packs and releases for independent creators.","bag"],
  ["community","03 / COMMUNITY","Community","Music releases, film writing, live show tickets, and official goods.","ticket"]
 ];

 return `
 <section class="home-hero">
  <div class="hero-inner">
   <p class="eyebrow">ARKWAY CREATIVE · BUILT BRICK BY BRICK</p>

   <h1>
    DESIRE.<br>
    DEDICATION.<br>
    <em>DISCIPLINE.</em>
   </h1>

   <p class="hero-copy">
    A creative company building music, media, strategy and experiences for independent creators and organisations.
   </p>

   <div class="hero-actions">
    <a class="primary large" href="#services">Book Services ${icon("arrow")}</a>
    <a class="hero-secondary large" href="#products">Shop Products ${icon("arrow")}</a>
    <a class="hero-tertiary large" href="#community/discography">Explore Catalog ${icon("arrow")}</a>
   </div>
  </div>
 </section>

 <section class="section">
  <div class="portal-head">
   <div>
    <p class="eyebrow">THE ARKWAY UNIVERSE</p>
    <h1>One company.<br><em>Multiple worlds.</em></h1>
   </div>

   <p>
    Move through the ArkWay ecosystem: build the work, access the tools,
    and experience the culture around it.
   </p>
  </div>

  <div class="door-grid">
   ${doors.map(d=>`
    <button class="door-card" data-href="#${d[0]}">
     <div class="door-top">
      <span>${d[1]}</span>
      <span>${icon(d[4])}</span>
     </div>

     <div>
      <h3>${d[2]}</h3>
      <p>${d[3]}</p>
     </div>

     <span class="door-cta">
      Explore ${icon("arrow")}
     </span>
    </button>
   `).join("")}
  </div>
 </section>`;
}

function services(){
 return `
 <section class="section">
  <div class="portal-head">
   <div>
    <p class="eyebrow">01 · SERVICES</p>
    <h1>Build the work.<br><em>Finish it properly.</em></h1>
   </div>

   <p>
    ArkWay combines creative production with practical strategy so ideas
    can move from concept to finished work without unnecessary friction.
   </p>
  </div>

  <div class="service-groups">
   ${servicesData.map(g=>`
    <article class="service-group">
     <div class="service-group-head">
      <span class="card-label">${g[0]}</span>
      <span>→</span>
     </div>

     <h3>${g[1]}</h3>
     <p>${g[2]}</p>

     <ul>
      ${g[3].map(x=>`<li>${x}</li>`).join("")}
     </ul>

     <button class="outline-action book-service" data-service="${g[1]}">
      Reach out to book →
     </button>
    </article>
   `).join("")}
  </div>

  <div class="services-contact-strip">
   <div>
    <span class="card-label">DIRECT BOOKING</span>
    <strong>Start with WhatsApp or email.</strong>
    <p>
     Tell us what you need, your deadline and what you already have.
     We will take it from there.
    </p>
   </div>

   <div class="services-contact-actions">
    <a
     class="primary large"
     target="_blank"
     rel="noopener noreferrer"
     href="${inquiry("a project with ArkWay","whatsapp")}">
     WhatsApp ${icon("arrow")}
    </a>

    <a
     class="secondary large"
     href="${inquiry("a project with ArkWay","email")}">
     Email ${icon("mail")}
    </a>
   </div>
  </div>
 </section>`;
}

function products(){
 const filters=[
  "ALL PRODUCTS",
  "BEATS",
  "FILM SCORES",
  "LOOPS",
  "DRUM KITS",
  "SOUND PACKS",
  "FX",
  "FOLEY"
 ];

 const active=window.productFilter||"ALL PRODUCTS";

 const visible=
  active==="ALL PRODUCTS"
   ?catalog
   :catalog.filter(x=>x.category===active);

 return `
 <section class="section" id="products">
  <div class="portal-head">
   <div>
    <p class="eyebrow">02 · PRODUCTS</p>
    <h1>Open the <em>sound vault.</em></h1>
   </div>

   <p>
    Digital tools for producers, filmmakers and artists — curated drops
    of beats, loops, drums, FX and foley, engineered for independent work.
   </p>
  </div>

  <div class="product-filter-bar" role="group" aria-label="Product categories">
   ${filters.map(f=>`
    <button
     type="button"
     class="${active===f?"active":""}"
     data-filter="${f}">
     ${f}
    </button>
   `).join("")}
  </div>

  <div class="product-grid" id="productGrid">
   ${
    visible.length
     ?visible.map(p=>`
      <article class="product-card" id="product-${p.id}">
       <div class="product-card-top">
        <div class="product-badges">
         <span class="product-category-badge">${p.category}</span>
         <span class="product-coming-pill">COMING SOON</span>
        </div>

        <span class="product-price">${p.price}</span>
       </div>

       <div class="product-card-copy">
        <h3>${p.title}</h3>
        <p class="product-spec">${p.specs}</p>
       </div>

       <div class="product-preview">
        <div class="product-preview-head">
         <span>DEMO PREVIEW</span>
         <span>PLACEHOLDER STREAM</span>
        </div>

        <div class="waveform">
         ${Array.from({length:42},(_,i)=>`
          <span style="height:${20+((i*19)%58)}%"></span>
         `).join("")}
        </div>

        <button
         type="button"
         class="product-preview-button"
         data-play="${p.id}">
         ▶ Play Demo
        </button>
       </div>

       <div class="product-actions">
        <a
         class="product-notify"
         href="https://arkway.hustlesasa.shop"
         target="_blank"
         rel="noopener noreferrer">
         Notify Me / Coming Soon →
        </a>

        <button
         type="button"
         class="product-share"
         data-share="${p.id}">
         Share Link →
        </button>
       </div>

function render(){
 const r=route();

 let content=
  r.root==="home"
   ?home()
   :r.root==="services"
    ?services()
    :r.root==="products"
     ?products()
     :r.sub==="discography"
      ?discography()
      :r.sub==="reels"
       ?reels()
       :community();

 document.getElementById("app").innerHTML=content;

 document.querySelectorAll(".navlink").forEach(b=>
  b.classList.toggle("active",b.dataset.route===r.root)
 );

 document.title=
  "ArkWay Creative — "+
  (r.root[0].toUpperCase()+r.root.slice(1));

 bind();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });
}

function bindProductControls(scope=document){

 scope.querySelectorAll("[data-play]").forEach(el=>
  el.addEventListener("click",()=>{
   const waveform=
    el.closest(".product-preview").querySelector(".waveform");

   waveform.classList.toggle("playing");

   el.textContent=
    waveform.classList.contains("playing")
     ?"Ⅱ Pause Demo"
     :"▶ Play Demo";
  })
 );

 scope.querySelectorAll("[data-share]").forEach(el=>
  el.addEventListener("click",async()=>{
   const u=
    location.origin+
    location.pathname+
    "#products?filter="+
    encodeURIComponent(window.productFilter||"ALL PRODUCTS")+
    "&id="+
    encodeURIComponent(el.dataset.share);

   try{
    await navigator.clipboard.writeText(u);
    el.textContent="Link Copied";
   }catch{
    window.prompt("Copy this ArkWay product link:",u);
   }

   setTimeout(()=>{
    el.textContent="Share Link →";
   },1800);
  })
 );
}

function bind(){

 document.querySelectorAll("[data-route]").forEach(el=>
  el.addEventListener("click",()=>{
   setRoute(el.dataset.route);
   document.getElementById("navlinks").classList.remove("open");
  })
 );

 document.querySelectorAll("[data-href]").forEach(el=>
  el.addEventListener("click",()=>{
   location.hash=el.dataset.href;
  })
 );

 document.querySelectorAll(".book-service").forEach(el=>
  el.addEventListener("click",()=>{
   showModal(el.dataset.service);
  })
 );

 /*
  Product filters intentionally use preventDefault so they remain
  dynamic controls inside the Products section. This does not affect
  the external media/community anchors above.
 */
 document.querySelectorAll("[data-filter]").forEach(el=>
  el.addEventListener("click",(event)=>{
   event.preventDefault();

   window.productFilter=el.dataset.filter;

   const section=document.getElementById("products");

   if(!section)return;

   const filterBar=section.querySelector(".product-filter-bar");
   const grid=section.querySelector("#productGrid");

   filterBar
    .querySelectorAll("[data-filter]")
    .forEach(btn=>
     btn.classList.toggle(
      "active",
      btn.dataset.filter===window.productFilter
     )
    );

   const visible=
    window.productFilter==="ALL PRODUCTS"
     ?catalog
     :catalog.filter(
       x=>x.category===window.productFilter
      );

   grid.innerHTML=
    visible.length
     ?visible.map(p=>`
      <article class="product-card" id="product-${p.id}">
       <div class="product-card-top">
        <div class="product-badges">
         <span class="product-category-badge">${p.category}</span>
         <span class="product-coming-pill">COMING SOON</span>
        </div>

        <span class="product-price">${p.price}</span>
       </div>

       <div class="product-card-copy">
        <h3>${p.title}</h3>
        <p class="product-spec">${p.specs}</p>
       </div>

       <div class="product-preview">
        <div class="product-preview-head">
         <span>DEMO PREVIEW</span>
         <span>PLACEHOLDER STREAM</span>
        </div>

        <div class="waveform">
         ${Array.from(
           {length:42},
           (_,i)=>`<span style="height:${20+((i*19)%58)}%"></span>`
         ).join("")}
        </div>

        <button
         type="button"
         class="product-preview-button"
         data-play="${p.id}">
         ▶ Play Demo
        </button>
       </div>

       <div class="product-actions">
        <a
         class="product-notify"
         href="https://arkway.hustlesasa.shop"
         target="_blank"
         rel="noopener noreferrer">
         Notify Me / Coming Soon →
        </a>

        <button
         type="button"
         class="product-share"
         data-share="${p.id}">
         Share Link →
        </button>
       </div>
      </article>
     `).join("")
     :`
      <div class="product-empty">
       <span class="eyebrow">NO PRODUCTS IN THIS CATEGORY YET</span>
       <h3>
        ${window.productFilter} are queued for a future ArkWay release.
       </h3>
       <p>
        Choose another category to keep exploring the sound vault.
       </p>
      </div>
     `;

   bindProductControls(grid);
  })
 );

 bindProductControls(document);

 document.querySelectorAll("[data-mode]").forEach(el=>
  el.addEventListener("click",()=>{
   document
    .querySelectorAll("[data-mode]")
    .forEach(x=>x.classList.remove("active"));

   el.classList.add("active");

   document.getElementById("discographyContent").innerHTML=
    el.dataset.mode==="download"
     ?downloads()
     :releases.map(r=>`
      <article class="release-card">
       <iframe
        src="${r[1]}"
        title="${r[0]} on Spotify"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
       </iframe>
      </article>
     `).join("");
  })
 );
}

function showModal(service){

 document.body.classList.add("locked");

 const wrap=document.createElement("div");

 wrap.className="modal-backdrop";

 wrap.innerHTML=`
  <div class="modal" role="dialog" aria-modal="true">

   <button class="modal-close" aria-label="Close">×</button>

   <p class="eyebrow">INSTANT INQUIRY</p>

   <h2>Book <em>${service}</em></h2>

   <p>
    Choose how you want to start the conversation.
    Your service details will be pre-filled.
   </p>

   <div class="modal-actions">

    <a
     class="primary large"
     target="_blank"
     rel="noopener noreferrer"
     href="${inquiry(service,"whatsapp")}">
     Open WhatsApp →
    </a>

    <a
     class="secondary large"
     href="${inquiry(service,"email")}">
     Send Email ✉
    </a>

   </div>

   <span class="modal-note">
    ${BUSINESS.phone} · ${BUSINESS.email}
   </span>

  </div>`;

 document.body.appendChild(wrap);

 const close=()=>{
  wrap.remove();
  document.body.classList.remove("locked");
 };

 wrap.addEventListener("mousedown",e=>{
  if(e.target===wrap)close();
 });

 wrap.querySelector(".modal-close").addEventListener("click",close);
}

document
 .getElementById("menuBtn")
 .addEventListener("click",()=>{
  document
   .getElementById("navlinks")
   .classList.toggle("open");
 });

window.addEventListener("hashchange",render);

if(!location.hash){
 history.replaceState({}, "", "#home");
}

render();
</script>
