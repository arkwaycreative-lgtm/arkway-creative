<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArkWay Creative — Data-Driven Media Company</title>
  <style>
    :root {
      --bg-dark: #090D16;
      --card-bg: #111827;
      --gold: #D4AF37;
      --gold-hover: #F3C623;
      --text-light: #F3F4F6;
      --text-muted: #9CA3AF;
      --border-dark: #1F2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
    }

    /* Hero Section Styling */
    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 1.5rem;
      background: radial-gradient(circle at center, #131B2E 0%, var(--bg-dark) 80%);
    }

    .hero .eyebrow {
      letter-spacing: 0.15em;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      max-width: 800px;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--gold);
      font-weight: 400;
    }

    .hero p {
      max-width: 650px;
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }

    /* Button Styling */
    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }

    .btn-primary {
      background-color: var(--gold);
      color: var(--bg-dark);
      border: 1px solid var(--gold);
      padding: 0.85rem 1.75rem;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      flex: 1 1 180px;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--gold-hover);
      border-color: var(--gold-hover);
    }

    .btn-secondary {
      background-color: #0D1219;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 0.85rem 1.75rem;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      flex: 1 1 180px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: rgba(212, 175, 55, 0.1);
    }

    .btn-text {
      display: block;
      width: 100%;
      margin-top: 1rem;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-text:hover {
      text-decoration: underline;
    }

    /* Main Container & Subview Rules */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .subview {
      margin-top: 2rem;
    }

    .back {
      background: none;
      border: none;
      color: var(--gold);
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    .portal-head {
      margin-bottom: 2rem;
    }

    .portal-head h1 {
      font-size: 2.2rem;
      margin-top: 0.25rem;
    }

    .portal-head h1 em {
      color: var(--gold);
      font-style: italic;
    }

    /* Media Grid & Cards */
    .community-reel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .universe-media-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .universe-video {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
    }

    .universe-video iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .universe-media-copy {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .universe-media-copy h3 {
      font-size: 1.25rem;
      color: var(--text-light);
    }

    .universe-media-copy h3 a {
      color: var(--text-light);
      text-decoration: none;
    }

    .universe-media-copy h3 a:hover {
      color: var(--gold);
    }

    .universe-media-copy p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <p class="eyebrow">DATA-DRIVEN MEDIA · EST. 2026</p>
    <h1>ArkWay Creative<br>— <em>a data-driven media company.</em></h1>
    <p>We merge audio production, visual storytelling, and brand architecture to build high-converting media and live culture — with data and audience intelligence informing the decisions behind the work.</p>
    
    <div class="hero-cta-group">
      <button class="btn-primary" onclick="setRoute('services')">Book Services →</button>
      <button class="btn-secondary" onclick="setRoute('products')">Shop Products →</button>
      <a href="#reels-section" class="btn-text" onclick="setRoute('reels')">Explore Catalog →</a>
    </div>
  </section>

  <!-- App Views Container -->
  <div class="container" id="app">
    <!-- Dynamic content rendered by JS -->
  </div>

  <script>
    function setRoute(route) {
      const app = document.getElementById('app');
      if (route === 'reels') {
        app.innerHTML = reels();
        window.scrollTo({ top: app.offsetTop - 20, behavior: 'smooth' });
      } else if (route === 'community') {
        app.innerHTML = `<section class="subview"><p>Community Portal Overview</p></section>`;
      } else if (route === 'services') {
        app.innerHTML = `<section class="subview"><p>Booking Services Portal</p></section>`;
      } else if (route === 'products') {
        app.innerHTML = `<section class="subview"><p>Products Storefront</p></section>`;
      }
    }

    function reels() {
      return `<section class="subview" id="reels-section">
        <button class="back" onclick="setRoute('community')">← Back to Community</button>
        <div class="portal-head">
          <div>
            <p class="eyebrow">VISUAL REELS & MEDIA</p>
            <h1>Showreels, Visuals & <em>Performances.</em></h1>
          </div>
          <p>Official Music Videos, Short Films, Production Discography & Live Sets.</p>
        </div>

        <!-- Featured Single & Short Film Embeds -->
        <div class="community-reel-grid">
          <article class="universe-media-card">
            <div class="universe-video">
              <iframe src="https://www.youtube-nocookie.com/embed/WEvb_J7JbO8" title="Elohim - Yovan (Official Music Video)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="universe-media-copy">
              <span class="card-label">OFFICIAL MUSIC VIDEO</span>
              <h3><a href="https://youtu.be/WEvb_J7JbO8" target="_blank" rel="noopener noreferrer">Elohim — Yovan (Official Music Video)</a></h3>
              <p>Official music video for "Elohim" by Yovan. Self-produced and engineered under ArkWay Creative.</p>
            </div>
          </article>

          <article class="universe-media-card">
            <div class="universe-video">
              <iframe src="https://www.youtube-nocookie.com/embed/jf3p-cdOKr8" title="SURVIVAL Short Film" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="universe-media-copy">
              <span class="card-label">SHORT FILM</span>
              <h3><a href="https://youtu.be/jf3p-cdOKr8" target="_blank" rel="noopener noreferrer">SURVIVAL | Short Film</a></h3>
              <p>Cinematic narrative short film produced and scored under ArkWay Creative.</p>
            </div>
          </article>
        </div>

        <!-- Playlists Section -->
        <div class="community-reel-grid" style="margin-top: 2rem;">
          <article class="universe-media-card">
            <div class="universe-video">
              <iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=PLq3yYhQm_l_q4PPukd724JAvg-XvJsGtt" title="Produced Work & Collaborations" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="universe-media-copy">
              <span class="card-label">DISCOGRAPHY & PLAYLIST</span>
              <h3><a href="https://youtube.com/playlist?list=PLq3yYhQm_l_q4PPukd724JAvg-XvJsGtt" target="_blank" rel="noopener noreferrer">Produced Work & Collaborations</a></h3>
              <p>Curated catalog of beats, production work, and artist collaborations managed under ArkWay Creative.</p>
            </div>
          </article>

          <article class="universe-media-card">
            <div class="universe-video">
              <iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=PLq3yYhQm_l_rKtCa7zhtH15RyT_bTDvsw" title="Live Sets & Performances" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="universe-media-copy">
              <span class="card-label">LIVE EXPERIENCE</span>
              <h3><a href="https://youtube.com/playlist?list=PLq3yYhQm_l_rKtCa7zhtH15RyT_bTDvsw" target="_blank" rel="noopener noreferrer">Live Sets & Performances</a></h3>
              <p>Live recordings, stage performances, and session archives.</p>
            </div>
          </article>
        </div>
      </section>`;
    }

    // Default view initialization
    setRoute('reels');
  </script>
</body>
</html>
